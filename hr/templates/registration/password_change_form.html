{% extends "hr/base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="login-wrap" style="margin-top:32px">
  <div class="card">
    <h1>Change your password</h1>
    <p class="sub">Choose a password of at least 10 characters that you don't use anywhere else.</p>
    <form method="post" class="stacked">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn" type="submit">Change password</button>
    </form>
  </div>
</div>
{% endblock %}
