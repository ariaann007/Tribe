# Render Blueprint: in the Render dashboard choose New > Blueprint and pick this repo.
databases:
  - name: tribe-db
    databaseName: tribe
    user: tribe
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: []  # only reachable from Render services

services:
  - type: web
    name: denizns-tribe
    runtime: python
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 60
    healthCheckPath: /login/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tribe-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DJANGO_ADMIN_USERNAME
        sync: false
      - key: DJANGO_ADMIN_PASSWORD
        sync: false
